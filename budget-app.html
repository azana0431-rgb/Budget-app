<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>BudgetAI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    background: #0a0a0f;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #e8e8f0;
    padding-bottom: 80px;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 48px 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-label { color: #7c7c9c; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .header-title span { color: #4f9cf9; }
  .remaining-label { color: #7c7c9c; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; text-align: right; }
  .remaining-amount { font-size: 26px; font-weight: 800; text-align: right; }
  .progress-row { display: flex; justify-content: space-between; margin: 16px 0 6px; }
  .progress-label { font-size: 12px; color: #7c7c9c; }
  .progress-bar-bg { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .progress-pct { font-size: 11px; color: #7c7c9c; text-align: right; margin-top: 4px; }

  .tabs { max-width: 600px; margin: 0 auto; padding: 16px 16px 0; }
  .tab-bar { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px; }
  .tab-btn {
    flex: 1; padding: 10px 0; border: none; border-radius: 9px;
    background: transparent; color: #7c7c9c;
    font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: rgba(79,156,249,0.15); color: #4f9cf9; font-weight: 700; }

  .content { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
  }
  .card-title { font-weight: 700; font-size: 13px; color: #a0a0c0; margin-bottom: 14px; }

  input, select {
    width: 100%; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px 14px;
    color: #e8e8f0; font-size: 14px; outline: none;
    -webkit-appearance: none; appearance: none;
    margin-bottom: 0;
  }
  input::placeholder { color: #5c5c7c; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .input-gap { margin-top: 10px; }

  .btn-primary {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #4f9cf9, #7b5cf9);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    margin-top: 12px;
  }

  .expense-list { display: flex; flex-direction: column; gap: 8px; }
  .expense-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .expense-left { display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .expense-name { font-weight: 600; font-size: 14px; }
  .expense-meta { font-size: 11px; color: #7c7c9c; margin-top: 2px; }
  .expense-right { display: flex; align-items: center; gap: 10px; }
  .expense-amount { font-weight: 700; font-size: 15px; color: #f87171; }
  .btn-delete {
    background: rgba(248,113,113,0.1); border: none;
    color: #f87171; border-radius: 6px; width: 28px; height: 28px;
    cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .empty { text-align: center; color: #5c5c7c; padding: 30px 0; }

  .budget-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 16px; margin-bottom: 10px;
  }
  .budget-item.over { border-color: rgba(248,113,113,0.3); }
  .budget-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .budget-left { display: flex; align-items: center; gap: 8px; }
  .budget-name { font-weight: 600; font-size: 14px; }
  .budget-spent { font-size: 12px; color: #7c7c9c; }
  .budget-amount { font-weight: 700; font-size: 14px; border-bottom: 1px dashed rgba(255,255,255,0.2); cursor: pointer; }
  .budget-mini-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .budget-mini-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
  .budget-over-msg { font-size: 11px; color: #f87171; margin-top: 6px; }
  .budget-input { padding: 4px 8px; font-size: 13px; width: 90px; text-align: right; margin: 0; }

  .income-hint { font-size: 12px; color: #5c5c7c; margin-top: 8px; }

  .method-btn {
    width: 100%; padding: 12px 16px; border-radius: 10px; cursor: pointer;
    text-align: left; font-size: 14px; margin-bottom: 8px; transition: all 0.2s;
    border: 1px solid rgba(255,255,255,0.07);
    background: transparent; color: #a0a0c0; font-weight: 500;
  }
  .method-btn.active { border-color: #4f9cf9; background: rgba(79,156,249,0.1); color: #4f9cf9; font-weight: 700; }

  .split-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 18px; margin-bottom: 10px;
  }
  .split-row { display: flex; justify-content: space-between; align-items: center; }
  .split-icon { font-size: 18px; margin-bottom: 4px; }
  .split-name { font-weight: 700; font-size: 15px; }
  .split-pct { font-size: 12px; color: #7c7c9c; }
  .split-amount { font-size: 26px; font-weight: 800; }
  .split-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; margin-top: 14px; overflow: hidden; }
  .split-bar-fill { height: 100%; border-radius: 2px; }

  .tip-box {
    margin-top: 16px; padding: 14px; border-radius: 12px;
    background: rgba(79,156,249,0.07); border: 1px solid rgba(79,156,249,0.2);
    font-size: 13px; color: #7c9cf9; line-height: 1.6;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div style="max-width:600px;margin:0 auto">
    <div class="header-row">
      <div>
        <p class="header-label">Monthly Overview</p>
        <h1 class="header-title">Budget<span>AI</span></h1>
      </div>
      <div>
        <p class="remaining-label">Remaining</p>
        <p class="remaining-amount" id="remainingAmt">$0.00</p>
      </div>
    </div>
    <div style="margin-top:18px">
      <div class="progress-row">
        <span class="progress-label" id="spentLabel">Spent $0.00</span>
        <span class="progress-label" id="incomeLabel">Income $3,500.00</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%;background:#4f9cf9"></div>
      </div>
      <p class="progress-pct" id="progressPct">0% of income</p>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tracker')">Tracker</button>
    <button class="tab-btn" onclick="switchTab('planner')">Planner</button>
    <button class="tab-btn" onclick="switchTab('calculator')">Calculator</button>
  </div>
</div>

<div class="content">

  <!-- TRACKER -->
  <div id="tab-tracker" class="tab-panel active">
    <div class="card">
      <p class="card-title">Add Expense</p>
      <input type="text" id="expDesc" placeholder="Description">
      <div class="input-grid">
        <input type="number" id="expAmount" placeholder="Amount ($)">
        <input type="date" id="expDate">
      </div>
      <div class="input-gap">
        <select id="expCat">
          <option>Housing</option><option>Food</option><option>Transport</option>
          <option>Health</option><option>Entertainment</option><option>Shopping</option>
          <option>Savings</option><option>Other</option>
        </select>
      </div>
      <button class="btn-primary" onclick="addExpense()">+ Add Expense</button>
    </div>
    <div class="expense-list" id="expenseList"></div>
  </div>

  <!-- PLANNER -->
  <div id="tab-planner" class="tab-panel">
    <div class="card">
      <p class="card-title">Monthly Income</p>
      <input type="number" id="plannerIncome" style="font-size:20px;font-weight:700;color:#4ade80" oninput="updateIncome(this.value)">
      <p class="income-hint" id="plannerHint"></p>
    </div>
    <div id="budgetList"></div>
    <p style="text-align:center;font-size:11px;color:#5c5c7c;margin-top:4px">Tap a budget amount to edit it</p>
  </div>

  <!-- CALCULATOR -->
  <div id="tab-calculator" class="tab-panel">
    <div class="card">
      <p class="card-title">Monthly Take-Home Income</p>
      <input type="number" id="calcIncome" style="font-size:24px;font-weight:800;color:#4ade80" oninput="updateCalc()">
    </div>
    <div class="card">
      <p class="card-title">Budgeting Method</p>
      <button class="method-btn active" onclick="setMethod('503020',this)">50/30/20 Rule</button>
      <button class="method-btn" onclick="setMethod('702010',this)">70/20/10 Rule</button>
      <button class="method-btn" onclick="setMethod('604020',this)">60/40 Rule</button>
    </div>
    <div id="calcResults"></div>
  </div>

</div>

<script>
const CAT_COLORS = {
  Housing:"#f59e0b",Food:"#10b981",Transport:"#3b82f6",Health:"#ec4899",
  Entertainment:"#8b5cf6",Shopping:"#f97316",Savings:"#06b6d4",Other:"#6b7280"
};

const METHODS = {
  "503020": { label:"50/30/20 Rule", tip:"Needs (50%), Wants (30%), Savings (20%) — the classic balance for most people.", splits:[{name:"Needs",pct:50,color:"#4f9cf9",icon:"🏠"},{name:"Wants",pct:30,color:"#8b5cf6",icon:"🎉"},{name:"Savings",pct:20,color:"#4ade80",icon:"💰"}] },
  "702010": { label:"70/20/10 Rule", tip:"Living expenses (70%), Savings (20%), Debt/Donations (10%) — great for paying off debt.", splits:[{name:"Living",pct:70,color:"#f59e0b",icon:"🏠"},{name:"Savings",pct:20,color:"#4ade80",icon:"💰"},{name:"Debt / Donate",pct:10,color:"#ec4899",icon:"🤝"}] },
  "604020": { label:"60/40 Rule", tip:"Committed expenses (60%), Discretionary & Savings (40%) — simple two-bucket approach.", splits:[{name:"Committed",pct:60,color:"#3b82f6",icon:"📋"},{name:"Discretionary & Savings",pct:40,color:"#10b981",icon:"✨"}] },
};

let state = {
  income: 3500,
  budgets: {Housing:1200,Food:400,Transport:200,Health:100,Entertainment:150,Shopping:200,Savings:300,Other:100},
  expenses: [
    {id:1,desc:"Rent",amount:1200,category:"Housing",date:"2026-05-01"},
    {id:2,desc:"Groceries",amount:85,category:"Food",date:"2026-05-02"},
    {id:3,desc:"Gas",amount:45,category:"Transport",date:"2026-05-01"},
  ],
  method: "503020"
};

const fmt = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);

function totalSpent() { return state.expenses.reduce((s,e)=>s+e.amount,0); }
function spentByCategory() {
  const m={};
  Object.keys(CAT_COLORS).forEach(c=>m[c]=0);
  state.expenses.forEach(e=>m[e.category]=(m[e.category]||0)+e.amount);
  return m;
}

function updateHeader() {
  const spent = totalSpent();
  const rem = state.income - spent;
  const pct = state.income > 0 ? Math.min(100,(spent/state.income)*100) : 0;
  document.getElementById("remainingAmt").textContent = fmt(rem);
  document.getElementById("remainingAmt").style.color = rem >= 0 ? "#4ade80" : "#f87171";
  document.getElementById("spentLabel").textContent = "Spent " + fmt(spent);
  document.getElementById("incomeLabel").textContent = "Income " + fmt(state.income);
  const fill = document.getElementById("progressFill");
  fill.style.width = pct + "%";
  fill.style.background = pct > 90 ? "#f87171" : pct > 70 ? "#fbbf24" : "#4f9cf9";
  document.getElementById("progressPct").textContent = Math.round(pct) + "% of income";
}

function renderExpenses() {
  const list = document.getElementById("expenseList");
  if (state.expenses.length === 0) { list.innerHTML = '<p class="empty">No expenses yet. Add one above!</p>'; return; }
  list.innerHTML = [...state.expenses].reverse().map(e => `
    <div class="expense-item">
      <div class="expense-left">
        <div class="dot" style="background:${CAT_COLORS[e.category]}"></div>
        <div>
          <div class="expense-name">${e.desc}</div>
          <div class="expense-meta">${e.category} · ${e.date}</div>
        </div>
      </div>
      <div class="expense-right">
        <span class="expense-amount">-${fmt(e.amount)}</span>
        <button class="btn-delete" onclick="removeExpense(${e.id})">×</button>
      </div>
    </div>
  `).join("");
}

function addExpense() {
  const desc = document.getElementById("expDesc").value.trim();
  const amount = parseFloat(document.getElementById("expAmount").value);
  const date = document.getElementById("expDate").value;
  const category = document.getElementById("expCat").value;
  if (!desc || !amount) return;
  state.expenses.push({id:Date.now(),desc,amount,category,date:date||new Date().toISOString().split("T")[0]});
  document.getElementById("expDesc").value="";
  document.getElementById("expAmount").value="";
  save(); render();
}

function removeExpense(id) {
  state.expenses = state.expenses.filter(e=>e.id!==id);
  save(); render();
}

function renderPlanner() {
  document.getElementById("plannerIncome").value = state.income;
  const totalBudget = Object.values(state.budgets).reduce((s,v)=>s+v,0);
  document.getElementById("plannerHint").textContent =
    `Total budgeted: ${fmt(totalBudget)} · ${fmt(state.income-totalBudget)} unallocated`;
  const spent = spentByCategory();
  document.getElementById("budgetList").innerHTML = Object.keys(CAT_COLORS).map(cat => {
    const s = spent[cat]||0, b = state.budgets[cat]||0;
    const pct = b > 0 ? Math.min(100,(s/b)*100) : 0;
    const over = s > b;
    return `
      <div class="budget-item ${over?'over':''}">
        <div class="budget-row">
          <div class="budget-left">
            <div class="dot" style="background:${CAT_COLORS[cat]}"></div>
            <span class="budget-name">${cat}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="budget-spent">${fmt(s)} /</span>
            <span class="budget-amount" style="color:${over?'#f87171':'#e8e8f0'}" onclick="editBudget('${cat}',this)">${fmt(b)}</span>
          </div>
        </div>
        <div class="budget-mini-bar">
          <div class="budget-mini-fill" style="width:${pct}%;background:${over?'#f87171':CAT_COLORS[cat]}"></div>
        </div>
        ${over?`<p class="budget-over-msg">Over budget by ${fmt(s-b)}</p>`:''}
      </div>
    `;
  }).join("");
}

function editBudget(cat, el) {
  const current = state.budgets[cat]||0;
  const inp = document.createElement("input");
  inp.className="budget-input";
  inp.type="number"; inp.value=current;
  inp.style.cssText="padding:4px 8px;font-size:13px;width:90px;text-align:right;margin:0;";
  el.replaceWith(inp);
  inp.focus();
  inp.onblur = () => { state.budgets[cat]=parseFloat(inp.value)||0; save(); render(); };
  inp.onkeydown = e => { if(e.key==="Enter") inp.blur(); };
}

function updateIncome(val) {
  state.income = parseFloat(val)||0;
  document.getElementById("calcIncome").value = state.income;
  save(); updateHeader(); renderCalc();
  const totalBudget = Object.values(state.budgets).reduce((s,v)=>s+v,0);
  document.getElementById("plannerHint").textContent =
    `Total budgeted: ${fmt(totalBudget)} · ${fmt(state.income-totalBudget)} unallocated`;
}

function renderCalc() {
  document.getElementById("calcIncome").value = state.income;
  const m = METHODS[state.method];
  document.getElementById("calcResults").innerHTML = m.splits.map(s => `
    <div class="split-card">
      <div class="split-row">
        <div>
          <div class="split-icon">${s.icon}</div>
          <div class="split-name">${s.name}</div>
          <div class="split-pct">${s.pct}% of income</div>
        </div>
        <div class="split-amount" style="color:${s.color}">${fmt(state.income*s.pct/100)}</div>
      </div>
      <div class="split-bar"><div class="split-bar-fill" style="width:${s.pct}%;background:${s.color}"></div></div>
    </div>
  `).join("") + `<div class="tip-box">💡 <strong>${m.label}:</strong> ${m.tip}</div>`;
}

function updateCalc() {
  state.income = parseFloat(document.getElementById("calcIncome").value)||0;
  document.getElementById("plannerIncome").value = state.income;
  save(); updateHeader(); renderCalc();
}

function setMethod(key, btn) {
  state.method = key;
  document.querySelectorAll(".method-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  save(); renderCalc();
}

function switchTab(name) {
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  event.target.classList.add("active");
}

function save() { try { localStorage.setItem("budgetai", JSON.stringify(state)); } catch(e){} }
function load() {
  try {
    const d = localStorage.getItem("budgetai");
    if (d) state = {...state, ...JSON.parse(d)};
  } catch(e){}
}

function render() { updateHeader(); renderExpenses(); renderPlanner(); renderCalc(); }

// Set today's date default
document.getElementById("expDate").value = new Date().toISOString().split("T")[0];

load();
render();
</script>
</body>
</html>
